name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    # 티크스 혹은 문서만 바뀔 때 동작 (원하면 범위를 줄이거나 늘리면 됨)
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - 'quartz/util/svg-inline.mjs'
      - '!quartz/static/tikz/**'   # 산출물 자체 변경만으로는 트리거하지 않기
      - 'docker/**'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

jobs:
  image:
    name: Build texlive-svg image
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push texlive image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/texlive-svg.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/concrete-pancake/docker/texlive-svg:latest
            ghcr.io/${{ github.repository_owner }}/concrete-pancake/docker/texlive-svg:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/concrete-pancake/docker/texlive-svg:buildcache
          cache-to: type=registry,mode=max,ref=ghcr.io/${{ github.repository_owner }}/concrete-pancake/docker/texlive-svg:buildcache

  svg:
    needs: image
    # github-actions 봇의 커밋으로 재트리거된 경우 스킵하여 루프 방지
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # 🔽 모든 스텝을 미리 빌드해둔 컨테이너에서 실행
    # 사전에 ghcr.io/<OWNER>/<REPO>/texlive-svg:latest 이미지를 올려두었음을 가정
    container:
      image: ghcr.io/${{ github.repository_owner }}/concrete-pancake/docker/texlive-svg:sha-${{ github.sha }}
      # (선택) 루트가 아닌 유저로 실행하고 싶다면 UID:GID 지정
      options: --user 1001:1001
    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Node는 컨테이너에 포함해뒀다면 생략 가능. 포함되지 않았다면 이 스텝이 컨테이너 내부에 설치함
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Ensure npm >= 10.9.2
        run: |
          npm -v
          npm i -g npm@^10.9.2 --no-package-lock
          npm -v

      - name: Install deps (optional)
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
          fi

      # ✅ 컨테이너 이미지에 이미 TeX Live/dvisvgm/gs/fonts가 들어 있으므로 설치 스텝 제거

      - name: Build SVGs from tikz
        run: |
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:lualatex
          npm run tikz:svg

      - name: format() after dvisvgm
        run: |
          echo '--- dvisvgm 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Inline SVGs
        run: node quartz/util/svg-inline.mjs

      - name: format() after post script
        run: |
          echo '--- post script 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Stash working tree (incl. untracked)
        run: git stash push -u -m "prebuild-stash"

      - name: Checkout publish
        run: |
          git fetch origin
          git checkout -B publish origin/publish || git checkout -b publish

      - name: Restore changes
        run: git stash pop || true

      - name: Commit SVG artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: publish
          commit_message: "chore(svg): update tikz SVGs"
          push_options: --force-with-lease