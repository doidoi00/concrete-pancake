name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - '!quartz/static/tikz/**' 
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

jobs:
  svg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/tikz-builder:latest
      options: --init

    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5


      - name: Restore node_modules cache
        id: modules_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-22-

      - name: Install deps (optional)
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci --prefer-offline --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          fi

      - name: Save node_modules cache
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}

      # Tectonic bundle 캐시
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/.local/share/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-v1
          restore-keys: |
            ${{ runner.os }}-tectonic-bundle-

      # Tectonic(LaTeX 엔진) 설치
      - uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dvisvgm / mutool
        run: |
          echo '--- dvisvgm --version ---'
          dvisvgm --version || true
          echo '--- mutool -v ---'
          mutool -v || true

      # Generate SVG .tex → .pdf → .svg → svgo
      #   (package.json에 아래 스크립트가 있다고 가정: tikz:pdf:tectonic / tikz:svg / tikz:opt / tikz)
      - name: Build SVGs from tikz
        env:
          DVISVGM_PDF_PROC: mutool
        run: |
          set -euxo pipefail
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:tectonic
          npm run tikz:svg

      - name: format() after tikz:svg
        run: |
          echo '--- tikz:svg 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Inline SVGs
        run: node quartz/util/svg-inline.mjs

      - name: format() after post script
        run: |
          echo '--- post script 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Stash working tree (incl. untracked)
        run: git stash push -u -m "prebuild-stash"

      - name: Checkout publish
        run:
          git fetch origin
          git checkout -B publish origin/publish || git checkout -b publish

      - name: Restore changes
        run: git stash pop || true

      # 변경사항 있을 때만 자동 커밋 (static/tikz/*.svg 등)
      - name: Commit SVG artifacts
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: publish
          commit_message: "chore(svg): update tikz SVGs"
          push_options: --force-with-lease

      # 끝. 이후 이 커밋을 감지한 Cloudflare Pages(Git 연동)가 Quartz 빌드 실행