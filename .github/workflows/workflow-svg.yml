name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    # 티크스 혹은 문서만 바뀔 때 동작 (원하면 범위를 줄이거나 늘리면 됨)
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - '!quartz/static/tikz/**'   # 산출물 자체 변경만으로는 트리거하지 않기
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  svg:
    # github-actions 봇의 커밋으로 재트리거된 경우 스킵하여 루프 방지
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Node가 꼭 필요하진 않지만, svgo나 스크립트를 쓸 수 있게 세팅
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: |
            package.json
            **/package.json

      - name: Restore node_modules cache
        id: modules_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-22-

      - name: Install deps (optional)
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci --prefer-offline --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          fi

      - name: Save node_modules cache
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}

      # Tectonic bundle 캐시
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/.local/share/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-v1
          restore-keys: |
            ${{ runner.os }}-tectonic-bundle-

      # Tectonic(LaTeX 엔진) 설치
      - uses: wtfjoke/setup-tectonic@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore APT archives (dvisvgm/gs/fonts)
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-apt-dvisvgm-gs-fonts-v1
          restore-keys: |
            ${{ runner.os }}-apt-

      # PDF→SVG 변환기 + CJK 폰트
      - name: Install inkscape, dvisvgm & fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Ensure APT archive cache directory exists for first-run (outside repo)
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo apt-get update
          # Use a temp-based APT archive dir so actions/cache can persist downloads
          sudo apt-get -o dir::cache::archives="$RUNNER_TEMP/apt-archives" install -y --no-install-recommends \
            dvisvgm ghostscript mupdf-tools poppler-utils xvfb fonts-noto-cjk

      - name: Check dvisvgm / mutool
        run: |
          echo '--- dvisvgm --version ---'
          dvisvgm --version || true
          echo '--- mutool -v ---'
          mutool -v || true

      - name: Prepare APT cache for save
        if: always()
        run: |
          sudo rm -f "$RUNNER_TEMP/apt-archives/lock" || true
          sudo rm -rf "$RUNNER_TEMP/apt-archives/partial" || true
          sudo find "$RUNNER_TEMP/apt-archives" -mindepth 1 -type f ! -name '*.deb' -delete || true
          sudo chmod -R a+r "$RUNNER_TEMP/apt-archives" || true

      - name: Save APT archives
        if: always() && steps.apt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-apt-dvisvgm-gs-fonts-v1

      # Generate SVG .tex → .pdf → .svg → svgo
      #   (package.json에 아래 스크립트가 있다고 가정: tikz:pdf:tectonic / tikz:svg / tikz:opt / tikz)
      - name: Build SVGs from tikz
        env:
          DVISVGM_PDF_PROC: mutool
        run: |
          set -euxo pipefail
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:tectonic
          npm run tikz:svg

      - name: format() after tikz:svg
        run: |
          echo '--- tikz:svg 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Inline SVGs
        run: node quartz/util/svg-inline.mjs

      - name: format() after post script
        run: |
          echo '--- post script 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Stash working tree (incl. untracked)
        run: git stash push -u -m "prebuild-stash"

      - name: Checkout publish
        run:
          git fetch origin
          git checkout -B publish origin/publish || git checkout -b publish

      - name: Restore changes
        run: git stash pop || true

      # 변경사항 있을 때만 자동 커밋 (static/tikz/*.svg 등)
      - name: Commit SVG artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: publish
          commit_message: "chore(svg): update tikz SVGs"
          push_options: --force-with-lease

      # 끝. 이후 이 커밋을 감지한 Cloudflare Pages(Git 연동)가 Quartz 빌드 실행