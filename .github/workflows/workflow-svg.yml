name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - '!quartz/static/tikz/**' 
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

jobs:
  svg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/tikz-builder:latest
      options: --init

    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5


      - name: Restore node_modules cache
        id: modules_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-22-

      - name: Install deps (optional)
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        run: |
            if [ -f package-lock.json ]; then
              npm ci --prefer-offline --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi

      - name: Save node_modules cache
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}

      # Tectonic bundle 캐시
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/.local/share/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-v1
          restore-keys: |
            ${{ runner.os }}-tectonic-bundle-


      # Generate SVG .tex → .pdf → .svg → svgo
      #   (package.json에 아래 스크립트가 있다고 가정: tikz:pdf:tectonic / tikz:svg / tikz:opt / tikz)
      - name: Build SVGs from tikz
        env:
          DVISVGM_PDF_PROC: mutool
        run: |
          set -euxo pipefail
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:tectonic
          npm run tikz:svg

      - name: format() after tikz:svg
        run: |
          echo '--- tikz:svg 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true
      
      - name: Analyze PDFs with PyMuPDF
        run: |
          set -euxo pipefail
          /opt/pymu/bin/python3 - <<'PY'
          import fitz, json, glob, pathlib, pikepdf

          def rgbint_to_tuple(c): return ((c>>16)&255, (c>>8)&255, c&255)

          EPS = 1e-6

          def is_zero(tok: str) -> bool:
            try:
                return abs(float(tok)) <= EPS
            except Exception:
                return False
          
          def is_one(tok: str) -> bool:
            try:
                return abs(float(tok) - 1.0) <= EPS
            except Exception:
                return False

          def recolor_tokens(tokens):
              edits = 0
              i = 0
              n = len(tokens)
              while i < n:
                  op = tokens[i]
                  # Gray fill/stroke: black(0) -> white(1)
                  if op == 'g' and i >= 1 and is_zero(tokens[i-1]):
                      tokens[i-1] = '1'
                      edits += 1
                  elif op == 'G' and i >= 1 and is_zero(tokens[i-1]):
                      tokens[i-1] = '1'
                      edits += 1
                  # RGB fill/stroke: black(0 0 0) -> white(1 1 1)
                  elif op == 'rg' and i >= 3 and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_zero(tokens[i-1]):
                      tokens[i-3], tokens[i-2], tokens[i-1] = '1', '1', '1'
                      edits += 1
                  elif op == 'RG' and i >= 3 and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_zero(tokens[i-1]):
                      tokens[i-3], tokens[i-2], tokens[i-1] = '1', '1', '1'
                      edits += 1
                  # CMYK fill/stroke: black(0 0 0 1) -> white(0 0 0 0)
                  elif op == 'k' and i >= 4 and is_zero(tokens[i-4]) and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_one(tokens[i-1]):
                      tokens[i-4], tokens[i-3], tokens[i-2], tokens[i-1] = '0', '0', '0', '0'
                      edits += 1
                  elif op == 'K' and i >= 4 and is_zero(tokens[i-4]) and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_one(tokens[i-1]):
                      tokens[i-4], tokens[i-3], tokens[i-2], tokens[i-1] = '0', '0', '0', '0'
                      edits += 1
                  i += 1
              return edits

          def white_to_transparent_once(tokens):
              edits = 0
              painting_ops = {'f', 'F', 'S', 's', 'B', 'B*', 'b', 'b*', 'f*'}
              armed = False
              new = []
              i = 0
              n = len(tokens)

              def is_paint_op(tok: str) -> bool:
                  return tok in painting_ops

              while i < n:
                  # Use lookahead to find patterns without advancing i yet
                  
                  # Gray: white(1)
                  if i + 1 < n and tokens[i+1] in ('g', 'G') and is_one(tokens[i]):
                      new.extend([tokens[i], tokens[i+1]])
                      new.append('/GSalpha0'); new.append('gs'); edits += 1; armed = True
                      i += 2
                      continue
                  # RGB: white(1 1 1)
                  elif i + 3 < n and tokens[i+3] in ('rg', 'RG') and is_one(tokens[i]) and is_one(tokens[i+1]) and is_one(tokens[i+2]):
                      new.extend([tokens[i], tokens[i+1], tokens[i+2], tokens[i+3]])
                      new.append('/GSalpha0'); new.append('gs'); edits += 1; armed = True
                      i += 4
                      continue
                  # CMYK: white(0 0 0 0)
                  elif i + 4 < n and tokens[i+4] in ('k', 'K') and is_zero(tokens[i]) and is_zero(tokens[i+1]) and is_zero(tokens[i+2]) and is_zero(tokens[i+3]):
                      new.extend([tokens[i], tokens[i+1], tokens[i+2], tokens[i+3], tokens[i+4]])
                      new.append('/GSalpha0'); new.append('gs'); edits += 1; armed = True
                      i += 5
                      continue
                  
                  # If no pattern matched, process the single token
                  op = tokens[i]
                  new.append(op)
                  if armed and is_paint_op(op):
                      new.append('/GSalpha1'); new.append('gs')
                      armed = False
                  i += 1
              
              if armed:
                  new.append('/GSalpha1'); new.append('gs')

              tokens[:] = new
              return edits

          def process_stream(stream: pikepdf.Stream) -> int:
              # Decode as latin-1 to preserve raw bytes spacing
              src = stream.read_bytes().decode('latin-1')
              tokens = src.split()
              edits_wt = white_to_transparent_once(tokens)      # 1) white -> transparent (next paint only)
              edits_bw = recolor_tokens(tokens)                 # 2) black -> white
              if edits_wt or edits_bw:
                  stream.write(' '.join(tokens).encode('latin-1'))
              return edits_wt + edits_bw

          stat = {} 
          out = {}
          for pdf in glob.glob("tikz/**/*.pdf", recursive=True):
              doc = fitz.open(pdf)
              stats = {"pages": len(doc), "text_black":0, "text_white":0, "draw_black":0, "draw_white":0}
              for page in doc:
                  # 도형/선 색상 (0..1 float RGB)
                  for d in page.get_drawings():
                      col = d.get("color")
                      fill = d.get("fill")
                      if col == (0,0,0) or fill == (0,0,0): stats["draw_black"] += 1
                      if col == (1,1,1) or fill == (1,1,1): stats["draw_white"] += 1
                  # 텍스트 색상 (정수 0xRRGGBB)
                  td = page.get_text("dict")
                  for b in td.get("blocks", []):
                      for l in b.get("lines", []):
                          for s in l.get("spans", []):
                              c = s.get("color")
                              if isinstance(c, int):
                                  r,g,b = rgbint_to_tuple(c)
                                  if (r,g,b) == (0,0,0):   stats["text_black"] += 1
                                  if (r,g,b) == (255,255,255): stats["text_white"] += 1
              stat[pdf] = stats
              with pikepdf.open(pdf) as doc:
                  edits_total = 0
                  for page in doc.pages:
                      if not page.get('/Resources'):
                          page.Resources = pikepdf.Dictionary()
                      if not page.Resources.get('/ExtGState'):
                          page.Resources.ExtGState = pikepdf.Dictionary()
                      
                      page.Resources.ExtGState['/GSalpha0'] = pikepdf.Dictionary(
                          Type='/ExtGState', ca=0.0
                      )
                      page.Resources.ExtGState['/GSalpha1'] = pikepdf.Dictionary(
                          Type='/ExtGState', ca=1.0
                      )

                      contents = page.Contents
                      if isinstance(contents, pikepdf.Stream):
                          edits_total += process_stream(contents)
                      elif isinstance(contents, pikepdf.Array):
                          for s in contents:
                              if isinstance(s, pikepdf.Stream):
                                  edits_total += process_stream(s)
                  out_path = pathlib.Path(pdf).with_suffix('').as_posix() + '-dark.pdf'
                  doc.save(out_path)
              out[pdf] = {"edits": edits_total}

          pathlib.Path("tikz-color-report.json").write_text(json.dumps(stat, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(stat, ensure_ascii=False, indent=2))
          PY

      - name: PDFs → PNGs (transparent)
        run: |
          set -euxo pipefail
          find tikz -type f -name '*.pdf' -print0 | \
            while IFS= read -r -d '' pdf; do
            base="${pdf%.pdf}"
            gs -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pngalpha -r450 \
               -dTextAlphaBits=4 -dGraphicsAlphaBits=4 \
               -o "${base}.png" "$pdf"
          done

      - name: Inline SVGs
        run: node quartz/util/svg-inline.mjs

      - name: format() after post script
        run: |
          echo '--- post script 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Checkout publish branch
        uses: actions/checkout@v5
        with:
          ref: publish
          path: _publish

      - name: Sync → _publish with rsync
        run: |
          set -euxo pipefail
          # .gitignore를 존중하고, _publish 자체와 .git은 제외
          rsync -a --delete \
            --filter=':- .gitignore' \
            --exclude='_publish/' \
            --exclude='.git/' \
            ./ _publish/

      - name: Commit & push artifacts to publish
        working-directory: _publish
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -euxo pipefail
          git config --global --add safe.directory /__w/concrete-pancake/concrete-pancake/_publish
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): update tikz outputs"
            git push origin HEAD:publish
          else
            echo "No changes to commit."
          fi