name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - '!quartz/static/tikz/**' 
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

jobs:
  svg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/tikz-builder:latest
      options: --init

    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5


      - name: Restore node_modules cache
        id: modules_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-22-

      - name: Install deps (optional)
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        run: |
            if [ -f package-lock.json ]; then
              npm ci --prefer-offline --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi

      - name: Save node_modules cache
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}

      # Tectonic bundle 캐시
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/.local/share/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-v1
          restore-keys: |
            ${{ runner.os }}-tectonic-bundle-


      # Generate SVG .tex → .pdf → .svg → svgo
      #   (package.json에 아래 스크립트가 있다고 가정: tikz:pdf:tectonic / tikz:svg / tikz:opt / tikz)
      - name: Build SVGs from tikz
        env:
          DVISVGM_PDF_PROC: mutool
        run: |
          set -euxo pipefail
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:tectonic
          npm run tikz:svg

      - name: format() after tikz:svg
        run: |
          echo '--- tikz:svg 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true
      
      - name: Analyze PDFs with PyMuPDF
        run: |
          set -euxo pipefail
          /opt/pymu/bin/python3 - <<'PY'
          import pymupdf, json, glob, pathlib, pikepdf, io

          def apply_stroke_style(sh, d):
              dash = d.get("dashes")
              line_cap = d.get("lineCap")
              line_join = d.get("lineJoin")
              miter = d.get("miterLimit")
              if dash:
                  try:
                      sh.set_dash(dash[0], dash[1])
                  except Exception:
                      pass
              if line_cap is not None:
                  try:
                      sh.set_line_cap(line_cap)
                  except Exception:
                      pass
              if line_join is not None:
                  try:
                      sh.set_line_join(line_join)
                  except Exception:
                      pass
              if miter is not None:
                  try:
                      sh.set_miter_limit(miter)
                  except Exception:
                      pass

          def rgbint_to_tuple(c): return ((c>>16)&255, (c>>8)&255, c&255)

          EPS = 1e-6

          def is_zero(tok: str) -> bool:
              try:
                  return abs(float(tok)) <= EPS
              except Exception:
                  return False

          def is_one(tok: str) -> bool:
              try:
                  return abs(float(tok) - 1.0) <= EPS
              except Exception:
                  return False

          def is_white(rgb):
              if rgb is None:
                  return False
              r, g, b = rgb
              return abs(r-1.0) < EPS and abs(g-1.0) < EPS and abs(b-1.0) < EPS

          def recolor_tokens(tokens):
              edits = 0
              i = 0
              n = len(tokens)
              while i < n:
                  op = tokens[i]
                  # Gray fill/stroke: black(0) -> white(1)
                  if op == 'g' and i >= 1 and is_zero(tokens[i-1]):
                      tokens[i-1] = '1'
                      edits += 1
                  elif op == 'G' and i >= 1 and is_zero(tokens[i-1]):
                      tokens[i-1] = '1'
                      edits += 1
                  # RGB fill/stroke: black(0 0 0) -> white(1 1 1)
                  elif op == 'rg' and i >= 3 and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_zero(tokens[i-1]):
                      tokens[i-3], tokens[i-2], tokens[i-1] = '1', '1', '1'
                      edits += 1
                  elif op == 'RG' and i >= 3 and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_zero(tokens[i-1]):
                      tokens[i-3], tokens[i-2], tokens[i-1] = '1', '1', '1'
                      edits += 1
                  # CMYK fill/stroke: black(0 0 0 1) -> white(0 0 0 0)
                  elif op == 'k' and i >= 4 and is_zero(tokens[i-4]) and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_one(tokens[i-1]):
                      tokens[i-4], tokens[i-3], tokens[i-2], tokens[i-1] = '0', '0', '0', '0'
                      edits += 1
                  elif op == 'K' and i >= 4 and is_zero(tokens[i-4]) and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_one(tokens[i-1]):
                      tokens[i-4], tokens[i-3], tokens[i-2], tokens[i-1] = '0', '0', '0', '0'
                      edits += 1
                  i += 1
              return edits

          def bw_process_stream(stream: pikepdf.Stream) -> int:
              # Decode as latin-1 to preserve raw bytes spacing
              src = stream.read_bytes().decode('latin-1')
              tokens = src.split()
              edits = recolor_tokens(tokens)
              if edits:
                  stream.write(' '.join(tokens).encode('latin-1'))
              return edits

          def white_fill_to_stroke_new_canvas(input: str) -> tuple[bytes, int]:
              """
              Build a NEW PDF that has the same page sizes as the source, but only
              re-draws paths whose fill is pure white, and draws them with fill=None
              (i.e., stroke-only). Returns (pdf_bytes, edits_count).
              """
              src = pymupdf.open(input)
              dst = pymupdf.open()
              total_edits = 0

              for page in src:
                  # create a blank page with the same canvas size
                  new_page = dst.new_page(width=page.rect.width, height=page.rect.height)

                  drawings = page.get_drawings()
                  if not drawings:
                      continue

                  sh = new_page.new_shape()
                  for d in drawings:
                      fill = d.get("fill")
                      if not is_white(fill):
                          continue

                      items = d.get("items") or []
                      if not items:
                          continue

                      # Rebuild the path geometry from items (generic path support)
                      for it in items:
                          if not it:
                              continue
                          op = it[0]
                          if op == "m":
                              pt = it[1]
                              sh.move_to(pt)
                          elif op == "l":
                              pt = it[1]
                              sh.line_to(pt)
                          elif op == "c":
                              p1, p2, p3 = it[1], it[2], it[3]
                              sh.curve_to(p1, p2, p3)
                          elif op == "re":
                              r = pymupdf.Rect(it[1])
                              sh.draw_rect(r)
                          elif op in ("h", "z"):
                              sh.close_path()
                          else:
                              # ignore graphics state ops like 'q','Q','cm','n' etc.
                              pass

                      apply_stroke_style(sh, d)
                      stroke_color = d.get("color", (0, 0, 0))
                      width = d.get("width", 1.0)
                      even_odd = bool(d.get("even_odd", False))

                      sh.finish(
                          fill=None,                 # ★ draw with no fill
                          color=stroke_color,        # keep original stroke if present
                          width=width,
                          even_odd=even_odd,
                      )
                      total_edits += 1

                  # commit what we drew on the blank page (overlay flag irrelevant on empty page)
                  sh.commit()

              pdf_bytes = dst.tobytes(deflate=True)
              src.close()
              dst.close()
              return pdf_bytes, total_edits

          def run_white_and_bw(input_path: str, output_path: str | None = None) -> dict:
              pdf_bytes, edits_w = white_fill_to_stroke_new_canvas(input_path)
              edits_bw = 0

              with pikepdf.open(io.BytesIO(pdf_bytes)) as doc:
                  for page in doc.pages:
                      contents = page.Contents
                      if not contents:
                          continue
                      if isinstance(contents, pikepdf.Stream):
                          edits_bw += bw_process_stream(contents)
                      elif isinstance(contents, pikepdf.Array):
                          for s in contents:
                              if isinstance(s, pikepdf.Stream):
                                  edits_bw += bw_process_stream(s)

                  if output_path is None:
                      p = pathlib.Path(input_path)
                      output_path = p.with_name(p.stem + '-dark' + p.suffix).as_posix()

                  if edits_w or edits_bw:
                      doc.save(output_path)

              return {"white_to_transparent": edits_w, "bw_token_edits": edits_bw, "output": output_path}

          stat = {}
          out = {}
          for pdf in glob.glob("tikz/**/*.pdf", recursive=True):
              doc = pymupdf.open(pdf)
              stats = {"pages": len(doc), "text_black":0, "text_white":0, "draw_black":0, "draw_white":0}
              for page in doc:
                  # 도형/선 색상 (0..1 float RGB)
                  for d in page.get_drawings():
                      col = d.get("color")
                      fill = d.get("fill")
                      if col == (0,0,0) or fill == (0,0,0): stats["draw_black"] += 1
                  # 텍스트 색상 (정수 0xRRGGBB)
                  td = page.get_text("dict")
                  for b in td.get("blocks", []):
                      for l in b.get("lines", []):
                          for s in l.get("spans", []):
                              c = s.get("color")
                              if isinstance(c, int):
                                  r,g,b = rgbint_to_tuple(c)
                                  if (r,g,b) == (0,0,0):   stats["text_black"] += 1
              stat[pdf] = stats
              doc.close()

              result = run_white_and_bw(pdf)
              out[pdf] = result

          pathlib.Path("tikz-color-report.json").write_text(json.dumps(stat, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(stat, ensure_ascii=False, indent=2))
          PY

      - name: PDFs → PNGs (transparent)
        run: |
          set -euxo pipefail
          find tikz -type f -name '*.pdf' -print0 | \
            while IFS= read -r -d '' pdf; do
            base="${pdf%.pdf}"
            gs -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pngalpha -r450 \
               -dTextAlphaBits=4 -dGraphicsAlphaBits=4 \
               -o "${base}.png" "$pdf"
          done

      - name: Inline SVGs
        run: node quartz/util/svg-inline.mjs

      - name: format() after post script
        run: |
          echo '--- post script 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Checkout publish branch
        uses: actions/checkout@v5
        with:
          ref: publish
          path: _publish

      - name: Sync → _publish with rsync
        run: |
          set -euxo pipefail
          # .gitignore를 존중하고, _publish 자체와 .git은 제외
          rsync -a --delete \
            --filter=':- .gitignore' \
            --exclude='_publish/' \
            --exclude='.git/' \
            ./ _publish/

      - name: Commit & push artifacts to publish
        working-directory: _publish
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -euxo pipefail
          git config --global --add safe.directory /__w/concrete-pancake/concrete-pancake/_publish
          git status
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): update tikz outputs"
            git push origin HEAD:publish
          else
            echo "No changes to commit."
          fi