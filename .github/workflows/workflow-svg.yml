name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - '!quartz/static/tikz/**' 
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

jobs:
  svg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/tikz-builder:latest
      options: --init

    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5


      - name: Restore node_modules cache
        id: modules_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-22-

      - name: Install deps (optional)
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        run: |
            if [ -f package-lock.json ]; then
              npm ci --prefer-offline --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi

      - name: Save node_modules cache
        if: ${{ steps.modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-22-${{ hashFiles('**/package.json') }}

      # Tectonic bundle 캐시
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/.local/share/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-v1
          restore-keys: |
            ${{ runner.os }}-tectonic-bundle-


      # Generate SVG .tex → .pdf → .svg → svgo
      #   (package.json에 아래 스크립트가 있다고 가정: tikz:pdf:tectonic / tikz:svg / tikz:opt / tikz)
      - name: Build SVGs from tikz
        env:
          DVISVGM_PDF_PROC: mutool
        run: |
          set -euxo pipefail
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:tectonic

      - name: Analyze PDFs with PyMuPDF & Edits Black/White
        run: |
          set -euxo pipefail
          /opt/pymu/bin/python3 - <<'PY'
          import pymupdf, json, glob, pathlib, pikepdf

          def rgbint_to_tuple(c): return ((c>>16)&255, (c>>8)&255, c&255)

          EPS = 1e-6

          def is_zero(tok: str) -> bool:
              try:
                  return abs(float(tok)) <= EPS
              except Exception:
                  return False

          def is_one(tok: str) -> bool:
              try:
                  return abs(float(tok) - 1.0) <= EPS
              except Exception:
                  return False

          def recolor_tokens(tokens: list[str]) -> tuple[int, int]:
              n = len(tokens)
              i = 0
              edits_bw = 0
              edits_wt = 0
              is_fill_white = False
              while i < n:
                  op = tokens[i]
                  # Nonstroking (fill) color state & black→white
                  if op == 'g' and i >= 1:
                      is_fill_white = is_one(tokens[i-1])
                      if is_zero(tokens[i-1]):
                          tokens[i-1] = '1'; edits_bw += 1
                  elif op == 'rg' and i >= 3:
                      r,g,b = tokens[i-3], tokens[i-2], tokens[i-1]
                      is_fill_white = is_one(r) and is_one(g) and is_one(b)
                      if is_zero(r) and is_zero(g) and is_zero(b):
                          tokens[i-3:i] = ['1','1','1']; edits_bw += 1
                  elif op == 'k' and i >= 4:
                      c,m,y,k_ = tokens[i-4], tokens[i-3], tokens[i-2], tokens[i-1]
                      is_fill_white = is_zero(c) and is_zero(m) and is_zero(y) and is_zero(k_)
                      if is_zero(c) and is_zero(m) and is_zero(y) and is_one(k_):
                          tokens[i-4:i] = ['0','0','0','0']; edits_bw += 1
                  # Stroking (stroke) black→white
                  elif op == 'G' and i >= 1:
                      if is_zero(tokens[i-1]):
                          tokens[i-1] = '1'; edits_bw += 1
                  elif op == 'RG' and i >= 3:
                      if is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_zero(tokens[i-1]):
                          tokens[i-3:i] = ['1','1','1']; edits_bw += 1
                  elif op == 'K' and i >= 4:
                      if is_zero(tokens[i-4]) and is_zero(tokens[i-3]) and is_zero(tokens[i-2]) and is_one(tokens[i-1]):
                          tokens[i-4:i] = ['0','0','0','0']; edits_bw += 1
                  # White fill → transparent (no paint)
                  elif op in ('f','f*','B','B*') and is_fill_white:
                      tokens[i] = 'n' if op in ('f','f*') else 'S'
                      edits_wt += 1
                  i += 1
              return edits_wt, edits_bw

          def process_stream(stream: pikepdf.Stream) -> tuple[int, int]:
              # Decode as latin-1 to preserve raw bytes spacing
              src = stream.read_bytes().decode('latin-1')
              tokens = src.split()
              edits_wt, edits_bw = recolor_tokens(tokens)
              if edits_wt or edits_bw:
                  stream.write(' '.join(tokens).encode('latin-1'))
              return edits_wt, edits_bw

          out = {}
          for pdf in glob.glob("tikz/**/*.pdf", recursive=True):
              try:
                  with pikepdf.open(pdf) as doc:
                      total_edits_wt = 0
                      total_edits_bw = 0
                      for page in doc.pages:
                          try:
                              contents = page.get('/Contents')
                          except (AttributeError, KeyError):
                              continue
                              
                          if not contents:
                              continue
                              
                          if isinstance(contents, pikepdf.Stream):
                              edits_wt, edits_bw = process_stream(contents)
                              total_edits_wt += edits_wt
                              total_edits_bw += edits_bw
                          elif isinstance(contents, pikepdf.Array):
                              for i in range(len(contents)):
                                  s = contents[i]
                                  if isinstance(s, pikepdf.Stream):
                                      edits_wt, edits_bw = process_stream(s)
                                      total_edits_wt += edits_wt
                                      total_edits_bw += edits_bw
                                      
                      out_path = pathlib.Path(pdf).with_suffix('').as_posix() + '-dark.pdf'
                      if total_edits_wt > 0 or total_edits_bw > 0:
                          doc.save(out_path)
                          
                  out[pdf] = {"edits": {"white_to_transparent": total_edits_wt, "black_to_white": total_edits_bw}}
              except Exception as e:
                  print(f"Error processing {pdf}: {e}")
                  out[pdf] = {"error": str(e)}

          pathlib.Path("tikz-transform.json").write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2))

          # Stats of black fills in PDFs
          stat = {}
          for pdf in glob.glob("tikz/**/*.pdf", recursive=True):
              doc = pymupdf.open(pdf)
              stats = {"pages": len(doc), "text_black":0, "text_white":0, "draw_black":0, "draw_white":0}
              for page in doc:
                  # 도형/선 색상 (0..1 float RGB)
                  for d in page.get_drawings():
                      col = d.get("color")
                      fill = d.get("fill")
                      if col == (0,0,0) or fill == (0,0,0): stats["draw_black"] += 1
                  # 텍스트 색상 (정수 0xRRGGBB)
                  td = page.get_text("dict")
                  for b in td.get("blocks", []):
                      for l in b.get("lines", []):
                          for s in l.get("spans", []):
                              c = s.get("color")
                              if isinstance(c, int):
                                  r,g,b = rgbint_to_tuple(c)
                                  if (r,g,b) == (0,0,0):   stats["text_black"] += 1
              stat[pdf] = stats
              doc.close()

          pathlib.Path("tikz-color-report.json").write_text(json.dumps(stat, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(stat, ensure_ascii=False, indent=2))
          PY

      - name: PDFs → PNGs (transparent)
        run: |
          set -euxo pipefail
          mkdir -p quartz/static/tikz
          find tikz -type f -name '*.pdf' -print0 | \
            while IFS= read -r -d '' pdf; do
            base="${pdf%.pdf}"
            gs -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pngalpha -r450 \
               -dTextAlphaBits=4 -dGraphicsAlphaBits=4 \
               -o "quartz/static/${base}.png" "$pdf"
          done

      - name: Checkout publish branch
        uses: actions/checkout@v5
        with:
          ref: publish
          path: _publish

      - name: Sync → _publish with rsync
        run: |
          set -euxo pipefail
          # .gitignore를 존중하고, _publish 자체와 .git은 제외
          rsync -a --delete \
            --filter=':- .gitignore' \
            --exclude='_publish/' \
            --exclude='.git/' \
            ./ _publish/

      - name: Commit & push artifacts to publish
        working-directory: _publish
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -euxo pipefail
          git config --global --add safe.directory /__w/concrete-pancake/concrete-pancake/_publish
          git status
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): update tikz outputs"
            git push origin HEAD:publish
          else
            echo "No changes to commit."
          fi