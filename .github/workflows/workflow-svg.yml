name: tikz-to-svg (prebuild)

on:
  push:
    branches: [ v4 ]
    # 티크스 혹은 문서만 바뀔 때 동작 (원하면 범위를 줄이거나 늘리면 됨)
    paths:
      - 'tikz/**'
      - 'content/**'
      - '.github/workflows/workflow-svg.yml'
      - 'quartz/util/tikz-extract.mjs'
      - '!quartz/static/tikz/**'   # 산출물 자체 변경만으로는 트리거하지 않기
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  svg:
    # github-actions 봇의 커밋으로 재트리거된 경우 스킵하여 루프 방지
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: tikz-svg-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Node가 꼭 필요하진 않지만, svgo나 스크립트를 쓸 수 있게 세팅
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: |
            package.json
            **/package.json

      - name: Ensure npm >= 10.9.2
        run: |
          npm -v
          npm i -g npm@^10.9.2 --no-package-lock
          npm -v

      # (선택) 패키지 설치: package.json에 svgo/chokidar-cli가 있다면
      - name: Install deps (optional)
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
          fi

      # Tectonic bundle 캐시
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/.local/share/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-v1
          restore-keys: |
            ${{ runner.os }}-tectonic-bundle-

      # Tectonic(LaTeX 엔진) 설치
      - uses: wtfjoke/setup-tectonic@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache APT archives (dvisvgm/gs/fonts)
        uses: actions/cache@v4
        with:
          path: .apt-cache
          key: ${{ runner.os }}-apt-dvisvgm-gs-fonts-v1
          restore-keys: |
            ${{ runner.os }}-apt-

      # PDF→SVG 변환기 + CJK 폰트
      - name: Install dvisvgm & gs & fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # Use a workspace-local APT archive dir so actions/cache can persist downloads
          sudo apt-get -o dir::cache::archives=$PWD/.apt-cache install -y --no-install-recommends \
            dvisvgm ghostscript fonts-noto-cjk

      # Generate SVG .tex → .pdf → .svg → svgo
      #   (package.json에 아래 스크립트가 있다고 가정: tikz:pdf:tectonic / tikz:svg / tikz:opt / tikz)
      - name: Build SVGs from tikz
        run: |
          mkdir -p quartz/static/tikz
          node quartz/util/tikz-extract.mjs
          npm run tikz:pdf:tectonic
          npm run tikz:svg

      - name: format() after dvisvgm
        run: |
          echo '--- dvisvgm 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Inline SVGs
        run: node quartz/util/svg-inline.mjs

      - name: format() after post script
        run: |
          echo '--- post script 직후 ---'
          grep -n "format(" quartz/static/tikz/*.svg || true

      - name: Stash working tree (incl. untracked)
        run: git stash push -u -m "prebuild-stash"

      - name: Checkout publish
        run:
          git fetch origin
          git checkout -B publish origin/publish || git checkout -b publish

      - name: Restore changes
        run: git stash pop || true

      # 변경사항 있을 때만 자동 커밋 (static/tikz/*.svg 등)
      - name: Commit SVG artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: publish
          commit_message: "chore(svg): update tikz SVGs"
          push_options: --force-with-lease

      # 끝. 이후 이 커밋을 감지한 Cloudflare Pages(Git 연동)가 Quartz 빌드 실행